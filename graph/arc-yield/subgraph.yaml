specVersion: 1.3.0
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: MorphoArcUsdcVault
    network: arc-testnet
    source:
      address: "0xAabbeF1D3971c710276ed41eC791BbE14CdB8E88"
      abi: ERC4626
      startBlock: 38608205
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - YieldAggregator
        - Vault
        - Token
        - Account
        - ActiveAccount
        - Deposit
        - Withdraw
        - UsageMetricsDailySnapshot
        - UsageMetricsHourlySnapshot
        - FinancialsDailySnapshot
        - VaultDailySnapshot
        - VaultHourlySnapshot
      abis:
        - name: ERC4626
          file: ./abis/ERC4626.json
      eventHandlers:
        - event: Deposit(indexed address,indexed address,uint256,uint256)
          handler: handleDeposit
        - event: Withdraw(indexed address,indexed address,indexed address,uint256,uint256)
          handler: handleWithdraw
      file: ./src/mapping.ts
  - kind: ethereum
    name: XyloArcUsdcVault
    network: arc-testnet
    source:
      address: "0x240Eb85458CD41361bd8C3773253a1D78054f747"
      abi: ERC4626
      # Begin at a verified live Deposit event. Historical Xylo activity before
      # this observation window is intentionally excluded from v0.2 metrics.
      startBlock: 61607600
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - YieldAggregator
        - Vault
        - Token
        - Account
        - ActiveAccount
        - Deposit
        - Withdraw
        - UsageMetricsDailySnapshot
        - UsageMetricsHourlySnapshot
        - FinancialsDailySnapshot
        - VaultDailySnapshot
        - VaultHourlySnapshot
      abis:
        - name: ERC4626
          file: ./abis/ERC4626.json
      eventHandlers:
        - event: Deposit(indexed address,indexed address,uint256,uint256)
          handler: handleDeposit
        - event: Withdraw(indexed address,indexed address,indexed address,uint256,uint256)
          handler: handleWithdraw
      file: ./src/mapping.ts
